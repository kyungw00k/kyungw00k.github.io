<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Newsletter Digest</title>
  <style>
    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --surface2: #1c1c1c;
      --surface3: #222;
      --border: #282828;
      --border2: #333;
      --text: #e2e2e2;
      --muted: #5a5a5a;
      --muted2: #888;
      --accent: #4f8ef7;
      --tech: #10b981;
      --newsletter: #a78bfa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── Header ── */
    header {
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: rgba(13,13,13,0.95);
      backdrop-filter: blur(8px);
      z-index: 10;
    }
    .logo { font-size: 0.95rem; font-weight: 600; letter-spacing: -0.01em; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .date-label { color: var(--muted2); font-size: 0.78rem; }
    select {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 0.78rem;
      cursor: pointer;
      outline: none;
    }

    /* ── Tabs ── */
    .tabs-bar {
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs-bar::-webkit-scrollbar { display: none; }
    .tab {
      padding: 10px 13px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      color: var(--muted2);
      font-size: 0.8rem;
      white-space: nowrap;
      transition: color 0.15s;
      display: flex;
      align-items: center;
      gap: 5px;
      user-select: none;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }
    .tab .badge {
      background: var(--surface3);
      border-radius: 9px;
      padding: 1px 6px;
      font-size: 0.7rem;
      color: var(--muted2);
    }
    .tab.active .badge { background: rgba(79,142,247,0.15); color: var(--accent); }

    /* ── Page ── */
    .page {
      max-width: 960px;
      margin: 0 auto;
      padding: 20px 24px 60px;
    }

    /* ── Accordion list ── */
    .accordion { display: flex; flex-direction: column; gap: 6px; }

    /* ── Accordion item ── */
    .item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      transition: border-color 0.15s;
    }
    .item:hover { border-color: var(--border2); }
    .item.open { border-color: var(--border2); }

    /* ── Item header (always visible, clickable) ── */
    .item-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 16px;
      cursor: pointer;
      user-select: none;
      min-width: 0;
    }
    .item-badges {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .src-badge {
      background: var(--surface3);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 0.7rem;
      color: var(--muted2);
      white-space: nowrap;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cat-badge {
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 0.68rem;
      font-weight: 500;
      white-space: nowrap;
    }
    .cat-기술     { background: rgba(16,185,129,0.12); color: var(--tech); }
    .cat-뉴스레터  { background: rgba(167,139,250,0.12); color: var(--newsletter); }

    .item-title {
      flex: 1;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    .item.open .item-title { white-space: normal; }

    .item-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .item-date { color: var(--muted); font-size: 0.68rem; white-space: nowrap; }
    .links-count {
      font-size: 0.68rem;
      color: var(--muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 7px;
      white-space: nowrap;
    }
    .chevron {
      color: var(--muted);
      font-size: 0.7rem;
      transition: transform 0.2s;
      flex-shrink: 0;
    }
    .item.open .chevron { transform: rotate(180deg); }

    /* ── Item body (collapsible) ── */
    .item-body {
      display: none;
      padding: 0 16px 16px;
      border-top: 1px solid var(--border);
      margin-top: 0;
    }
    .item.open .item-body { display: block; }

    /* summary callout */
    .item-summary {
      font-size: 0.83rem;
      color: var(--muted2);
      line-height: 1.65;
      padding: 11px 13px;
      background: var(--surface2);
      border-radius: 7px;
      margin: 14px 0 12px;
      border-left: 3px solid var(--border2);
    }

    /* links grid */
    .links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 5px;
    }
    .link-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 7px;
      background: var(--surface2);
      transition: background 0.12s;
      text-decoration: none;
    }
    .link-item:hover { background: var(--surface3); }
    .link-bullet {
      color: var(--accent);
      font-size: 1rem;
      line-height: 1.3;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .link-body { flex: 1; min-width: 0; }
    .link-title {
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
      display: block;
      word-break: keep-all;
      overflow-wrap: break-word;
    }
    .link-item:hover .link-title { color: var(--accent); }
    .link-desc {
      font-size: 0.74rem;
      color: var(--muted2);
      margin-top: 4px;
      line-height: 1.5;
      word-break: keep-all;
      overflow-wrap: break-word;
    }
    .link-domain {
      display: inline-block;
      font-size: 0.65rem;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 1px 5px;
      margin-top: 5px;
    }
    .no-links { font-size: 0.78rem; color: var(--muted); padding: 6px 0; }

    /* states */
    .empty   { color: var(--muted2); text-align: center; padding: 60px 0; font-size: 0.88rem; }
    .loading { color: var(--muted);  text-align: center; padding: 60px 0; }
  </style>
</head>
<body>

<header>
  <span class="logo">📬 Newsletter Digest</span>
  <div class="header-right">
    <select id="dateSelect" onchange="loadDate(this.value)"></select>
    <span class="date-label" id="dateLabel"></span>
  </div>
</header>

<div class="tabs-bar" id="tabs"></div>
<div class="page" id="content"><div class="loading">불러오는 중…</div></div>

<script>
  let allItems = [];
  let currentTab = 'all';

  /* ── data loading ── */
  async function loadAvailableDates() {
    const sel = document.getElementById('dateSelect');
    try {
      const dates = await (await fetch('/digest/data/index.json')).json();
      dates.forEach(d => {
        const o = document.createElement('option');
        o.value = d; o.textContent = d;
        sel.appendChild(o);
      });
    } catch {
      const o = document.createElement('option');
      o.value = 'latest'; o.textContent = '최신';
      sel.appendChild(o);
    }
  }

  async function loadDate(dateStr) {
    document.getElementById('content').innerHTML = '<div class="loading">불러오는 중…</div>';
    try {
      const url = `/digest/data/${dateStr === 'latest' ? 'latest' : dateStr}.json`;
      const data = await (await fetch(url)).json();
      renderPage(data);
    } catch {
      document.getElementById('content').innerHTML = '<div class="empty">데이터를 불러올 수 없습니다.</div>';
    }
  }

  /* ── render ── */
  function renderPage(data) {
    document.getElementById('dateLabel').textContent = data.date || '';
    allItems = data.items || [];
    currentTab = 'all';
    renderTabs();
    renderContent();
  }

  function renderTabs() {
    const sources = [...new Set(allItems.map(i => i.source))].sort();
    const tabs = [
      { id: 'all', label: 'All', count: allItems.length },
      ...sources.map(s => ({ id: s, label: s, count: allItems.filter(i => i.source === s).length }))
    ];
    document.getElementById('tabs').innerHTML = tabs.map(t => `
      <div class="tab ${t.id === currentTab ? 'active' : ''}" data-tab="${t.id}" onclick="switchTab('${esc(t.id)}')">
        ${esc(t.label)}<span class="badge">${t.count}</span>
      </div>`).join('');
  }

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab').forEach(el =>
      el.classList.toggle('active', el.dataset.tab === tab));
    renderContent();
  }

  function renderContent() {
    const items = currentTab === 'all' ? allItems : allItems.filter(i => i.source === currentTab);
    const el = document.getElementById('content');
    if (!items.length) { el.innerHTML = '<div class="empty">항목이 없습니다.</div>'; return; }
    el.innerHTML = `<div class="accordion">${items.map((item, idx) => renderItem(item, idx)).join('')}</div>`;
  }

  function renderItem(item, idx) {
    const linksCount = item.links ? item.links.length : 0;

    const linksHtml = linksCount
      ? `<div class="links-grid">${item.links.map(l => {
          const domain = extractDomain(l.url);
          return `<a class="link-item" href="${esc(l.url)}" target="_blank" rel="noopener">
            <span class="link-bullet">•</span>
            <span class="link-body">
              <span class="link-title">${esc(l.title || l.url)}</span>
              ${l.summary ? `<span class="link-desc">${esc(l.summary)}</span>` : ''}
              ${domain ? `<span class="link-domain">${esc(domain)}</span>` : ''}
            </span>
          </a>`;
        }).join('')}</div>`
      : `<div class="no-links">링크 없음</div>`;

    return `
      <div class="item open" id="item-${idx}">
        <div class="item-header" onclick="toggleItem(${idx})">
          <div class="item-badges">
            <span class="src-badge" title="${esc(item.source)}">${esc(item.source)}</span>
            <span class="cat-badge cat-${esc(item.category)}">${esc(item.category)}</span>
          </div>
          <span class="item-title">${esc(item.subject)}</span>
          <div class="item-right">
            <span class="item-date">${formatDate(item.date)}</span>
            ${linksCount > 0 ? `<span class="links-count">링크 ${linksCount}개</span>` : ''}
            <span class="chevron">▼</span>
          </div>
        </div>
        <div class="item-body">
          ${item.summary ? `<div class="item-summary">${esc(item.summary)}</div>` : ''}
          ${linksHtml}
        </div>
      </div>`;
  }

  function toggleItem(idx) {
    const el = document.getElementById(`item-${idx}`);
    if (el) el.classList.toggle('open');
  }

  /* ── utils ── */
  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function extractDomain(url) {
    try {
      const h = new URL(url).hostname.replace(/^www\./, '');
      const parts = h.split('.');
      return parts.length >= 2 ? parts.slice(-2).join('.') : h;
    } catch { return ''; }
  }

  function formatDate(s) {
    if (!s) return '';
    try {
      return new Date(s).toLocaleDateString('ko-KR', { year:'numeric', month:'short', day:'numeric' });
    } catch { return s; }
  }

  /* ── init ── */
  loadAvailableDates().then(() => loadDate('latest'));
</script>
</body>
</html>
